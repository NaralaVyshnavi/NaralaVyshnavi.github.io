<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ecommerce Product</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f1f3f6;
    margin:0;
    padding:0;
}

.container{
    width:90%;
    max-width:1100px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
    display:flex;
    gap:40px;
}

.left{
    flex:1;
}

.left img{
    width:100%;
    border-radius:10px;
}

.thumbnail-container{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.thumbnail-container img{
    width:70px;
    cursor:pointer;
    border:2px solid transparent;
    border-radius:6px;
}

.thumbnail-container img:hover{
    border:2px solid #2874f0;
}

.right{
    flex:1.2;
}

.title{
    font-size:26px;
    font-weight:bold;
}

.brand{
    color:#555;
    margin-bottom:8px;
}

.rating{
    color:#fff;
    background:#388e3c;
    display:inline-block;
    padding:4px 8px;
    border-radius:5px;
    margin:8px 0;
}

.price{
    font-size:28px;
    color:#b12704;
    margin:10px 0;
}

.original{
    text-decoration:line-through;
    color:gray;
    margin-left:10px;
    font-size:18px;
}

.discount{
    color:green;
    font-weight:bold;
    margin-left:10px;
}

.section{
    margin:15px 0;
}

button{
    background:#ff9f00;
    border:none;
    padding:12px 25px;
    font-size:16px;
    cursor:pointer;
    border-radius:5px;
    margin-top:15px;
}

button:hover{
    background:#fb8c00;
}

.stock{
    font-weight:bold;
}

.in{
    color:green;
}

.out{
    color:red;
}

@media(max-width:768px){
    .container{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div id="product"></div>

<script>
function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
}

const id = getParam("id");

fetch(`https://dummyjson.com/products/${id}`)
.then(res => res.json())
.then(product => {

    const discountPrice = (product.price - (product.price * product.discountPercentage/100)).toFixed(2);

    document.getElementById("product").innerHTML = `
    <div class="container">
        <div class="left">
            <img id="mainImage" src="${product.thumbnail}">
            <div class="thumbnail-container">
                ${product.images.map(img => `<img src="${img}" onclick="changeImage('${img}')">`).join("")}
            </div>
        </div>

        <div class="right">
            <div class="title">${product.title}</div>
            <div class="brand">Brand: ${product.brand}</div>
            <div class="rating">⭐ ${product.rating}</div>

            <div class="price">
                $${discountPrice}
                <span class="original">$${product.price}</span>
                <span class="discount">${product.discountPercentage}% off</span>
            </div>

            <div class="section">
                <strong>Description:</strong>
                <p>${product.description}</p>
            </div>

            <div class="section">
                <strong>Category:</strong> ${product.category}
            </div>

            <div class="section">
                <strong>Stock:</strong>
                <span class="stock ${product.stock > 0 ? 'in':'out'}">
                    ${product.stock > 0 ? "In Stock" : "Out of Stock"}
                </span>
            </div>

            <div class="section">
                <strong>SKU:</strong> ${product.sku}
            </div>

            <div class="section">
                <strong>Weight:</strong> ${product.weight}g
            </div>

            <div class="section">
                <strong>Dimensions:</strong>
                ${product.dimensions?.width || '-'} x 
                ${product.dimensions?.height || '-'} x 
                ${product.dimensions?.depth || '-'} cm
            </div>

            <div class="section">
                <strong>Warranty:</strong> ${product.warrantyInformation || "1 Year Warranty"}
            </div>

            <div class="section">
                <strong>Return Policy:</strong> ${product.returnPolicy || "7 Days Replacement"}
            </div>

            <div class="section">
                <strong>Tags:</strong> ${product.tags?.join(", ")}
            </div>

            <button>Add to Cart</button>
        </div>
    </div>
    `;
});

function changeImage(src){
    document.getElementById("mainImage").src = src;
}
</script>

</body>
</html>
