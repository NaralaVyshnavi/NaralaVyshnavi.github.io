    <style>
        .abc{

        }
    </style>
</head>
<body>
    <div id="root"></div>

        var products=["Ravi","Arjun","Nani"];
        var productList=<table border="1" cellPadding="5" style={{color:"skyblue",backgroundColor:"pink",borderCollapse:"collapse"
        }}>
            <tbody>   
                {
                    products.map(p=>{
                        return (
                        <tr>
                            <td>{p}</td>
                        </tr>
    
                        )
                    })
                }
            </tbody>
            </table>

        ReactDOM.render(productList,document.getElementById("root"));
