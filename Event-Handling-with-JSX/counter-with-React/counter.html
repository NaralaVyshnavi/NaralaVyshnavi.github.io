<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #d8cfc4, #f5e6da);
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            background:white;
            padding:40px 60px;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,0.1);
            display:flex;
            align-items:center;
            gap:30px;
            font-size:40px;
            color:#5c4b3b;
        }

        button{
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            font-size:25px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s ease;
        }

        button:first-child{
            background:#c97b63;
            color:white;
        }

        button:last-child{
            background:#7a9e7e;
            color:white;
        }

        button:hover{
            transform:scale(1.1);
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        button:disabled{
            background:#ccc;
            cursor:not-allowed;
            transform:none;
            box-shadow:none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">

        var count=0;
        if(JSON.parse(localStorage.getItem("count"))){
            count=JSON.parse(localStorage.getItem("count"));
        }
        function genUI(){
            var jsx=<h1>
                <button disabled={count<1} id="decrementbtn"onClick={()=>{decrementCount()}}>-</button>
                
                    {count}
                <button id="incrementbtn" onClick={()=>{incrementCount()}}>+</button>
                    </h1>

        ReactDOM.render(jsx,document.getElementById("root"));
        }
        genUI();
        function incrementCount(){
            count++;
            localStorage.setItem("count",JSON.stringify(count));
            genUI();
        }
        function decrementCount(){
            count--;
            localStorage.setItem("count",JSON.stringify(count));
            genUI();
        }
    </script>
</body>
</html>
